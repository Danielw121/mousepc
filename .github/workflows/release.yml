# Al subir una etiqueta vX.Y.Z (por ejemplo: git tag v1.0.1 && git push origin v1.0.1)
# compila la app de Android y el paquete de Windows y los publica como una Release.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.MOUSEPC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mousepc.jks"
          echo "MOUSEPC_KEYSTORE=$RUNNER_TEMP/mousepc.jks" >> "$GITHUB_ENV"
          echo "MOUSEPC_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Compilar APK
        working-directory: app_android
        env:
          MOUSEPC_KEYSTORE_PASSWORD: ${{ secrets.MOUSEPC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MousePC.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: MousePC.apk

  windows:
    name: Servidor Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Empaquetar
        shell: pwsh
        run: ./servidor_pc/empaquetar.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v','') -Python python -Out dist
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/MousePC-Servidor-Windows.zip

  release:
    name: Publicar
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Crear Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Descargas**
          - `MousePC.apk`: app para Android 8 o superior.
          - `MousePC-Servidor-Windows.zip`: programa para Windows 10/11. Extráelo y abre `Instalar MousePC.cmd`.

          Guía de instalación: https://danielw121.github.io/mousepc/
          EOF
          gh release create "$GITHUB_REF_NAME" MousePC.apk MousePC-Servidor-Windows.zip \
            --repo "$GITHUB_REPOSITORY" --title "MousePC ${GITHUB_REF_NAME#v}" --notes-file notes.md
